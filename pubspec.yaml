name: medigo_admin
description: Medigo Admin Panel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0

  # State Management
  provider: ^6.1.5+1

  # UI
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  flutter_svg: ^2.2.4
  shimmer: ^3.0.0
  intl: ^0.20.2
  google_fonts: ^8.0.2
  data_table_2: ^2.7.2
  dropdown_button2: ^3.0.0

  # Utils
  uuid: ^4.5.3
  go_router: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
